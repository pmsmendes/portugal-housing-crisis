name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows: the project is developed and tested there (paths, fonts, line endings).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Tests that need the gitignored raw/interim data skip themselves; the committed processed panels and report tables are enough for the rest.
      - run: uv run pytest -q
