# Dataset access details, keyed by source id (= module in src/pthousing/data/sources/
# and folder in data/raw/). One entry per dataset; the human-readable registry with
# coverage and caveats is docs/data_catalog.md (same dataset ids).
#
# Template:
# <source_id>:
#   <dataset_id>:
#     url: ...            # or api indicator id
#     format: csv|xlsx|json|gpkg
#     notes: ...
#
# Checked 2026-10-21 against the live endpoints. `todo` = not located / not verified.

ine:
  # INE JSON API: data  https://www.ine.pt/ine/json_indicador/pindica.jsp?op=2&varcd=<code>&Dim1=<period>&lang=EN
  #               meta  https://www.ine.pt/ine/json_indicador/pindicaMeta.jsp?varcd=<code>&lang=EN
  # Dim1=T returns all periods (large series can time out / return 503: request one period, e.g. Dim1=S3A202608).
  # Period codes: S7A<yyyy> annual, S5A<yyyy><q> quarterly, S3A<yyyymm> monthly, S3A.. semi-annual per meta.
  # `geocod`: 7 chars = NUTS III prefix (3) + 4-digit municipality code -> muni_code = geocod[3:];
  #           9 chars = parish; Census series use the plain 4-char municipality code (6 = parish).
  #           Rows with `-` / missing `valor` are suppressed cells. Several indicators mix NUTS-III-level
  #           and municipality rows under the same 7-char width: filter against the CAOP municipality list.
  # Series are split by NUTS vintage (2013 vs 2024) and methodology; see docs/data_quality.md before splicing.

  ine_median_price_sqm:
    # Quarterly last-12-months median, EUR/m2. All verified municipal (308 x 3 housing categories).
    indicator_id: "0012234"          # Methodology 2022, NUTS 2024, 4Q2019 - 1Q2026
    alt_indicator_ids:
      methodology_2018: "0009490"    # NUTS 2013, 1Q2016 - 3Q2021 (308 municipalities)
      methodology_2018_annual: "0010032"   # annual, 2016-2020
      methodology_2022_nuts2013: "0011364" # 4Q2019 - 4Q2023, superseded by 0012234
      sales_count_12m: "0014363"     # number of sales (12 months), 4Q2019 - 1Q2026, 308 municipalities
      annual_median: "0012254"       # annual 2019-2025 (by dwelling typology)
    format: json
    notes: >
      dim_3: H1 total, H11 new, H12 existing (2022 method). Overlap check done (median ratio 1.002): use 0009490 up to 3Q2019
      and 0012234 from 4Q2019. 'New' is blank in 52% of municipality-quarters; use Total / Existing.
  ine_median_rent_sqm:
    indicator_id: "0012598"          # semi-annual last-12-months median, 2nd sem 2020 - 2nd sem 2024, NUTS 2024
    alt_indicator_ids:
      annual_median: "0012600"       # annual 2020-2024 (638 rows for 2024 incl. parishes)
      new_leases_n: "0012601"        # annual number of new leases (thin-cell flag)
    format: json
    notes: Methodology 2021 only; earlier rent series not located.
  ine_hpi:
    indicator_id: "0014765"          # Housing price index, base 2025, quarterly 1Q2009 - 2Q2026
    alt_indicator_ids:
      base_2015: "0009201"           # 1Q2009 - 4Q2025
      base_2010: "0007837"           # 1Q2009 - 4Q2016
    format: json
    notes: National only, split by dwelling category (existing / new). No NUTS II detail in this indicator.
  ine_bank_valuation:
    indicator_id: "0012248"          # monthly median EUR/m2, Jan 2011 - Aug 2026, municipality (2024) x construction type
    alt_indicator_ids:
      annual: "0012256"              # 2011 - 2025
      monthly_municipality_2013: "0010042"   # Jan 2011 - Nov 2023 (older vintage)
    format: json
    notes: >
      dim_3: T total, 1 flats, 2 villas. All 308 municipalities listed, but 64% of Total cells are blank (about 118
      municipalities with a value in a typical month); annual 0012256 is still 44% blank.
  ine_income:
    indicator_id: "0012748"          # gross reported income per taxable person, annual 2018 - 2024, NUTS 2024 (308 municipalities)
    alt_indicator_ids:
      median: "0012749"              # median gross reported income per taxable person, 2018 - 2024
      nuts2013: "0009933"            # 2015 - 2021 (NUTS 2013 vintage)
      median_nuts2013: "0009934"
    format: json
    notes: >
      IRS-based; unit is the tax household, not the person. Use the median series for affordability ratios.
      NUTS 2013 and 2024 vintages are identical on 2018-2021: take 0009933/4 for 2015-2017 and 0012748/9 from 2018.
  ine_population:
    indicator_id: "0008273"          # resident population by sex/age, annual 2011 - 2023, NUTS 2013
    format: json
    notes: >
      dim_3 sex (T/M/F) x dim_4 five-year age groups. Total sex/age: 10.56 M (2011) to 11.20 M (2023), +2-3% a year
      2021-2023. A newer vintage through 2025 (NUTS 2024) exists; indicator id todo. Pre-2011 series todo.
  ine_population_change:
    indicator_ids:
      net_migration: "0008269"       # net migration (No.), annual 2011 - 2023, NUTS 2013, 308 municipalities
      natural_increase: "0008270"    # natural increase = live births - deaths (No.)
      population_change: "0008271"   # population change (No.)
    format: json
    notes: >
      Demographic indicators of INE's annual estimates. Verified 2026-10-24: all three are municipal counts with
      no extra dimension, 2011 - 2023. Population change = natural increase + net migration (the estimate has no
      separate statistical adjustment at municipal level; checked in validate.py). Crude rates are 0008262 - 0008265.
  ine_census:
    # Decennial; municipality rows are 4-char codes, parishes 6-char.
    indicator_ids:
      vacant_pct_2021: "0012517"     # proportion of vacant conventional dwellings, 2021, NUTS 2024 (308 municipalities)
      occupied_by_tenure_2021: "0012531"   # conventional dwellings of usual residence by tenure, 2021
      vacant_pct_2011: "0008378"     # 2011 (NUTS 2013) - code taken from the catalogue, not yet checked
      vacant_pct_2001: "0000772"     # 2001 - code taken from the catalogue, not yet checked
    format: json
    notes: >
      2021 vacancy and tenure verified (308 municipalities, plain 4-char codes). Tenure 0012531 has dim_3 tenure (owner,
      lease, other) and dim_4 years of residence.
    stock_and_area:       # 2011 / 2021, all 308 municipalities; fetched with filters (INE_FILTERED in interim.py)
      dwellings_2011: "0006304"      # filter Dim4=T, Dim5=T; dim_3 occupancy (T, 11 usual, 12 secondary, 2 vacant ...)
      dwellings_2021: "0012502"      # filter Dim4=T, Dim5=T; dim_3 (T, 1 usual, 2 secondary, 3 + 4 vacant)
      households_2011: "0006457"     # filter Dim3=T, Dim4=T, Dim5=T
      households_2021: "0012856"     # filter Dim3=T, Dim4=T, Dim5=T
      households_by_size: "0006457 (Dim3=T, Dim5=T; size in dim_4: 01 to 09 persons) and 0012856 (Dim3=T, Dim4=T; size in dim_5: 1, 2, 3, 4 or more)"   # verified 2026-10-25, 308 municipalities; stored beside the total-only files, builders pick the rows they need
      mean_useful_area_2011: "0006988"   # dwellings of usual residence, m2
      mean_useful_area_2021: "0012518"
      totals: 5.86 M (2011) and 5.97 M (2021) conventional dwellings, 4.04 M and 4.15 M households (match the census)
    other_censuses: "2001 and 1991 codes still to be checked (the 2001 families indicator 0001349 is regions only). Checked 2026-10-26 for 2001 households by size per municipality: web searches found only a national table and a 2011 table by residence in 2001, no municipal indicator id; a scan of the metadata endpoint over ids 0000700 to 0001400 was cut short when the API stopped answering (timeouts), so the range is not covered."
  ine_construction:
    # Municipal (308 x 5 dwelling typologies verified for licensed dwellings).
    licensed_dwellings: "0013235"    # new family dwellings licensed, annual 2002 - 2025, NUTS 2024
    licensed_dwellings_1995: "0000087"   # annual 1995 - 2025, NUTS 2002 geography
    completed_dwellings: "0013248"   # annual 2011 - 2025, NUTS 2024
    completed_dwellings_1995: "0000076"  # annual 1995 - 2025, NUTS 2002 geography
    licensed_monthly: "0008066"      # monthly series (geography not checked)
    format: json
    notes: >
      New construction for family housing only. dim_3: T total, 1-4 bedrooms (0-1, 2, 3, 4+). 1995 series carry exact zeros
      for Vizela/Trofa/Odivelas before they existed: use harmonize.mask_pre_creation.
  ine_cpi:
    indicator_id: "0014642"          # CPI base 2025, annual 1948 - 2025 (by geography and special aggregates)
    alt_indicator_ids:
      monthly: "0014640"             # Jan 1948 - Sep 2026
      by_coicop_annual: "0014641"
    format: json
    notes: >
      Headline all-items = geocod PT, dim_3 T (1948-2025, 2025=100; 2024=97.717). Other dim_3 values are special aggregates.
      Re-referencing to BASE_YEAR=2024 is done in harmonize.py.
  ine_construction_costs:
    indicator_id: "0011748"          # new housing construction cost index (base 2021), monthly, Jan 2000 - Aug 2026, national
    format: json
    notes: >
      Verified 2026-10-26: dim_3 T total, 1 materials, 2 manpower (labour); national only. Fetch one period at a time like
      the other monthly series. Input costs of building new family housing, not what builders charge and not land.
      Eurostat's sts_copi_q/a carries the same total (Portugal reports identical cost and producer-price indices) but stops in 2023.
  ine_price_by_buyer:
    indicator_id: "0012246"          # median sale price per m2, last 12 months, by tax residence of the purchaser, quarterly 4Q2019 - 2Q2026, NUTS 2024
    alt_indicator_ids:
      quarter_only: "0012239"        # same, single quarter, from 1Q2019 (thinner cells)
      by_institutional_sector: "0012240"   # by institutional sector of the purchaser
    format: json
    notes: >
      Verified 2026-10-26: dim_3 T total, 1 national territory, 21 European Union, 22 other countries, 2 foreign (EU plus other).
      Municipal rows (7-char geocod, 308 x 5), NUTS III, regions, parishes (9-char) and PT. Prices only: INE publishes no count
      of sales by buyer residence, and a cell is blank when there are too few transactions, so a municipality with a foreign-buyer
      price is one with enough foreign purchases (the total count of sales is `ine_median_price_sqm.sales_12m_n`).
      Banco de Portugal's real-estate direct investment (about 3.9 bn euros in 2025, press reports) was not located in BPstat's
      datasets (domains 161, 162 and 189 hold no activity split): unresolved.
  ine_building_works:
    # Municipal (308 x 3 project types x 3 purposes verified 2026-10-26). Counts of BUILDINGS, not dwellings.
    licensed_buildings: "0013234"    # licensed buildings by type of project and purpose, annual 2002 - 2025, NUTS 2024
    completed_buildings: "0013247"   # completed buildings by type of project and purpose, annual 2011 - 2025, NUTS 2024
    format: json
    notes: >
      dim_3: T total of building works, 1 new constructions, 2 enlargements, changes and reconstructions (the rehabilitation
      of existing buildings and extensions, with no split between them); dim_4: T total, 1 family housing, 2 others. The unit is
      the building, so a reconstruction of a block counts as one and says nothing about the dwellings it holds or adds; works
      that need no licence (exempt or notified to the council) are not in it. Licensed 2002-2025, completed 2011-2025 only.

bportugal:
  # API base https://bpstat.bportugal.pt/data/v1 (301 -> trailing slash; send a User-Agent, urllib's default gets 403).
  # Series metadata: /series/?series_ids=<id>&lang=EN ; dataset (JSON-stat with observations): /domains/<d>/datasets/<dataset_id>?lang=EN
  bp_mortgage:
    base_url: https://bpstat.bportugal.pt/data/v1
    series:
      new_housing_aprc: 12533714       # APRC, new pure operations, house purchase, individuals (dataset 5e42e781...), monthly 2003-01 - 2026-08
      new_housing_rate_lt1y: 12533730  # annualised agreed rate, new business, <1y floating, house purchase (dataset 6eaa8db9...)
      stock_housing_rate_gt5y: 12519759  # stock rate, loans >5y, house purchase (dataset 851facff...)
      new_housing_volume_lt1y: 12533719  # new business volume, EUR m
      new_fixed_rate_p50: 12710738     # median rate of new housing loans, fixed (dataset 6a83b46f..., domain 186, ~93 months only)
    format: json
    notes: >
      Domains 21 (interest rates), 186 (loans for house purchase), 39 (housing prices). All five series verified and fetched
      (284 months, Jan 2003-Aug 2026; the fixed-rate median 93 months from Dec 2018). Dataset and domain are looked up from the
      series id at fetch time. Definitions differ (APRC vs agreed rate vs stock rate), see data_quality.md. Household debt: bp_household_debt below.
  bp_lending_standards:
    # Not BPstat: files of the publication page "Macroprudential measures in Portugal - progress report - March 2026"
    # (https://www.bportugal.pt/en/publicacao/macroprudential-measures-portugal-progress-report-march-2026, found 2026-10-26).
    files:
      report_march_2026_en.pdf: https://www.bportugal.pt/sites/default/files/documents/2026-07/Macroprudential-measures-in-Portugal-Progress-report-March-2026.pdf
      chart_data_march_2026.xlsx: https://www.bportugal.pt/sites/default/files/documents/2026-07/Acompanhamento_medidas_macroprudenciais_2026.xlsx
    format: xlsx
    notes: >
      The workbook (10 MB, 28 sheets) holds the data of every chart: new housing loans by LTV, DSTI, risk profile and maturity,
      yearly 2018 Q3 and 2019-2025 (maturity quarterly, the guarantee monthly in 2025), read by sources/bp_lending_standards.py into
      data/external/lending_series.csv. The PDF is AES-encrypted (pypdf needs the `cryptography` package to read it), not used.
      The site refuses the default python user agent for pages (HTTP 403 to WebFetch); the files download with a browser-like one.
  bp_household_debt:
    base_url: https://bpstat.bportugal.pt/data/v1
    series:
      housing_loans_stock: 12458133      # household loans for house purchase, stock, EUR m, monthly (domain 18, non-consolidated, all lenders)
      housing_loans_gdp: 12458135        # same, % of GDP, quarterly
      housing_loans_growth: 12457869     # household housing loans, annual rate of change of transactions-based flows, %, monthly (consolidated)
      household_debt_stock: 12457924     # household debt including trade credits, all purposes, EUR m, monthly
      household_debt_gdp: 12457925       # same, % of GDP, quarterly
      household_debt_income: 12457926    # same, % of disposable income, quarterly
    format: json
    notes: >
      Domain 18 (indebtedness of the non-financial sector), households and non-profit institutions serving households.
      Stocks are non-consolidated and cover all lenders, not only banks. Same fetch and parse as bp_mortgage.

eurostat:
  # Dissemination API https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/<dataset> (JSON-stat 2.0).
  # `params` are sent as query parameters; `geo` is a list (repeated parameter).
  eurostat_hpi:
    dataset: prc_hpi_q
    params: {purchase: TOTAL, unit: I15_Q}      # index 2015=100, all dwellings purchased
    geo: [PT, ES, IT, FR, DE, IE, EU27_2020]
    format: json
    notes: Verified; 2005-Q1 to 2026-Q2. Peer set for the EU comparison; add geo codes here to widen it.
  eurostat_hicp:
    dataset: prc_hicp_aind
    params: {coicop: CP00, unit: INX_A_AVG}     # all-items, annual average index
    geo: [PT, EU27_2020]
    format: json
    notes: Verified; annual average index 1996-2025. Cross-check for the INE CPI deflator.
  eurostat_demography:
    dataset: demo_gind
    params: {indic_de: [JAN, GROW, NATGROW, CNMIGRAT, LBIRTH, DEATH]}   # counts: 1 January population, change, natural change, net migration plus adjustment, births, deaths
    geo: [PT]
    format: json
    notes: >
      Verified 2026-10-24; national, 1960 to the latest year. `CNMIGRAT` is net migration plus statistical adjustment,
      so it is the residual of total change after natural change. Gives the 30-year split that INE offers only from 2011.
  eurostat_gdp:
    dataset: nama_10_gdp
    params: {na_item: B1GQ, unit: CLV_PCH_PRE}   # GDP at market prices, chain-linked volumes, % change on the previous year
    geo: [PT]
    format: json
    notes: Verified 2026-10-24; annual, national.
  eurostat_unemployment:
    dataset: lfsa_urgan
    params: {age: Y15-74, sex: T, citizen: TOTAL, unit: PC}  # unemployment rate, % of the active population aged 15 to 74
    geo: [PT]
    format: json
    notes: >
      Verified 2026-10-24; annual, national, 1995 onward (labour force survey). The shorter une_rt_a starts only in 2009
      for Portugal.
  eurostat_compensation:
    dataset: nama_10_a10
    params: {nace_r2: TOTAL, na_item: D1, unit: CP_MEUR}   # compensation of employees, current prices, EUR million
    geo: [PT]
    format: json
    notes: Verified 2026-10-24; annual, whole economy. Divided by employees (eurostat_employees) for compensation per employee.
  eurostat_employees:
    dataset: nama_10_a10_e
    params: {nace_r2: TOTAL, na_item: SAL_DC, unit: THS_PER}   # employees, domestic concept, thousand persons
    geo: [PT]
    format: json
    notes: Verified 2026-10-24; annual, whole economy.
  eurostat_property_tax:
    dataset: gov_10a_taxag
    params: {sector: S13, unit: MIO_EUR, na_item: [D29A, D214C]}   # general government; D29A taxes on land, buildings and other structures; D214C taxes on financial and capital transactions
    geo: [PT]
    format: json
    notes: >
      Verified 2026-10-25; annual, national, 1995-2025 (the PC_GDP unit is rounded to one decimal, too coarse: shares of GDP
      are computed from eurostat_gdp_nominal). D29A is, in practice, IMI (the municipal property tax); D214C
      is the taxes on financial and capital transactions, which in Portugal is IMT (property transfer tax) plus stamp duty
      on those transactions. National accounts record taxes on an accrual basis, so a year can differ from cash collection:
      2024 is IMI 1,677 and D214C 1,675 EUR million against 1,630 (assessed) and 1,733 (cash IMT) in the simulator anchors. Standing in for the municipal series (at_imi_imt), which exists only as PDF reports.
  eurostat_property_tax_peers:
    dataset: gov_10a_taxag
    params: {sector: S13, unit: MIO_EUR, na_item: [D29A, D214C]}   # same items as eurostat_property_tax, for Portugal and the peer set
    geo: [PT, ES, IT, FR, DE, IE, EU27_2020]
    format: json
    notes: >
      Verified 2026-10-25; annual, 1995-2024 (some countries 2025). D29A (taxes on land, buildings and other structures)
      is comparable across the peers as the recurrent property tax. D214C is not: Germany books its transfer tax
      elsewhere (D214C is 0.00% of GDP) and Italy's is near zero, so it is stored but not compared.
  eurostat_gdp_nominal:
    dataset: nama_10_gdp
    params: {na_item: B1GQ, unit: CP_MEUR}   # GDP at market prices, current prices, EUR million
    geo: [PT, ES, IT, FR, DE, IE, EU27_2020]
    format: json
    notes: Verified 2026-10-25; annual. Denominator for the property tax and housing spending shares of GDP (PT and the peer set).
  eurostat_housing_spending:
    dataset: gov_10a_exp
    params: {sector: S13, unit: MIO_EUR, na_item: TE, cofog99: [GF06, GF0601, GF1006]}   # general government total expenditure by function (COFOG)
    geo: [PT, ES, IT, FR, DE, IE, EU27_2020]
    format: json
    notes: >
      Verified 2026-10-25; annual, 1995-2024 for Portugal (2025 not yet published). GF0601 is housing development (including
      public housing), GF1006 is housing in social protection (housing allowances and rent subsidies), GF06 is housing and
      community amenities (also holds water supply, street lighting and community development, so it is not housing
      spending). Tax expenditures (IRS deductions, IMT/IMI exemptions) are not expenditure in COFOG and are not here. The
      PC_GDP unit is rounded to one decimal, so shares come from eurostat_gdp_nominal. The EU27 aggregate starts in 2010.

at:
  # IMI rates: Portal das Financas "Consultar Taxas do Municipio" (public, read-only HTML, one page per year and district).
  # Verified 2026-10-22: 308 municipalities in every year 2012-2025 (22 district lists incl. 3 island capitals), no errors.
  at_imi_rates:
    url: https://www.portaldasfinancas.gov.pt/pt/CD/main.jsp
    query: "<url>?body=/imi/consultarTaxasIMI.jsp&ano=<year>&distrito=<district>"   # year 1989-2026 offered; one request per (year, district)
    districts: ["01AVEIRO", "02BEJA", "03BRAGA", "04BRAGANCA", "05C BRANCO", "06COIMBRA", "07EVORA", "08FARO", "09GUARDA", "10LEIRIA", "11LISBOA", "12PORTALEGRE", "13PORTO", "14SANTAREM", "15SETUBAL", "16VIANA DO CASTELO", "17VILA REAL", "18VISEU", "19ANGRA DO HEROISMO", "20HORTA", "21PONTA DELGADA", "22FUNCHAL"]
    format: "html (ISO-8859-1 table: municipality code, name, urban rate %, rustic rate %, parish-rate flag, family-deduction link)"
    notes: >
      Urban rate (prédios urbanos avaliados nos termos do CIMI) per municipality and tax year; 'ano' is the tax year
      (decided by the municipal assembly in the last months of the year; inferred from press counts of municipalities
      at the 0.3% floor). Mainland codes are the 4-digit INE codes of muni_code; island municipalities use a district
      scheme (19xx-22xx) and need a name match. 83 municipality-years (12 municipalities, e.g. Gondomar, Lagos,
      Espinho) have parish-specific rates and no single urban rate. Fetched at <= 1 request/s with a research
      User-Agent; keep the raw pages in data/raw/at/ as dated snapshots (the portal shows the rates as stored today).
  # No official machine-readable IMI/IMT revenue series found (DGAL / AT statistics: todo).
  # Third-party only: Flat In Portugal, municipal IMI rates 2023-2025 (Zenodo DOI 10.5281/zenodo.22935147,
  # https://flatin.pt/pt/ferramentas/dados-abertos-imi/) - not verified, superseded by at_imi_rates.
  at_imi_imt: {}

rnal:
  # Turismo de Portugal open data, ArcGIS MapServer layer (public, updated 2026-10-21).
  rnal_al:
    url: https://geo.turismodeportugal.pt/server/rest/services/TDP/OpenData_AL/MapServer/6
    query: "<url>/query?where=1=1&outFields=*&returnGeometry=true&f=json"   # 111,937 records, maxRecordCount 200000
    format: json
    notes: >
      Fields incl. NrRNAL, DataRegisto, DataAberturaPublico, Modalidade, NrUtentes, DTMNFR (parish/municipality code),
      Concelho, NUTSIII. Point geometry. Snapshot of currently registered units only; MAINLAND ONLY (no Azores / Madeira units).
      Each download is kept as data/raw/rnal/rnal_<date>.json; names and addresses are not requested.

caop:
  # DGT CAOP 2024, one GeoPackage zip per territory (HEAD checks returned 200).
  caop_boundaries:
    urls:
      continente: https://geo2.dgterritorio.gov.pt/caop/CAOP_Continente_2024-gpkg.zip
      madeira: https://geo2.dgterritorio.gov.pt/caop/CAOP_RAM_2024-gpkg.zip
      azores: https://geo2.dgterritorio.gov.pt/caop/CAOP_RAA_2024-gpkg.zip   # 15.3 MB
    format: gpkg
    notes: Metadata published 2025-02-27. A later extraordinary CAOP2024.1 (restored parishes) exists; URL not found.

aima:
  # AIMA (ex-SEF) data reaches us through INE; municipal rows verified in 0010247.
  aima_foreigners:
    indicator_id: "0010247"          # foreign population with legal residence status by NUTS 2013 and nationality, 2014 - 2023
    alt_indicator_ids:
      nuts2024: "0013219"            # 2021 - 2023
      national_by_sex: "0001274"     # national, 1980 - 2023
    format: json
    notes: INE series ends 2023 (AIMA data delay). AIMA "Relatório de Migrações e Asilo" has municipal 2024/2025 values but only as PDF.

bis:
  # BIS Data Portal SDMX API v2 (CSV). WS_SPP = selected residential property prices; key = freq.area.value.unit (empty = all).
  bis_spp:
    base_url: https://stats.bis.org/api/v2/data/dataflow/BIS
    dataflow: WS_SPP/1.0
    key: "Q.PT.."          # Portugal, quarterly: N nominal and R real (CPI-deflated), unit 628 (index 2010=100) and 771 (y/y %)
    format: csv
    notes: >
      Verified 2026-10-23: 153 quarters, 1988-Q1 to 2026-Q1, four series. Whole-country, all dwellings. Before 2009 the series
      is the BIS compilation from national sources (there is no INE index before 2009); how it joins the INE index is tested
      in validate.cross_checks and written up in data_quality.md.

oecd:
  # OECD SDMX API (CSV with labels). Analytical house price indicators, annual, Portugal.
  oecd_house_prices:
    base_url: https://sdmx.oecd.org/public/rest/data
    dataflow: "OECD.ECO.MPD,DSD_AN_HOUSE_PRICES@DF_HOUSE_PRICES,"
    key: "PRT.A.."        # area.freq.(all measures).(all units)
    format: csv
    notes: >
      Verified 2026-10-23: HPI nominal and RHP real house price index 1988-2025 (2015=100); HPI_RPI price-to-rent 1988-2025;
