# Scenario assumptions for the Phase 4 simulator (read by src/pthousing/simulation/scenarios.py).
# Every number must cite its source or rationale in docs/decisions.md.
# Values are placeholders (null) until estimated in Phases 2-4.

horizon_years: 10
base_year: 2024

scenarios:
  optimistic:
    population_growth_pct: null
    net_migration_per_year: null
    household_income_growth_real_pct: null
    mortgage_rate_pct: null
    completions_per_year: null
  baseline:
    population_growth_pct: null
    net_migration_per_year: null
    household_income_growth_real_pct: null
    mortgage_rate_pct: null
    completions_per_year: null
  pessimistic:
    population_growth_pct: null
    net_migration_per_year: null
    household_income_growth_real_pct: null
    mortgage_rate_pct: null
    completions_per_year: null

# Policy levers. "direct" = accounting effect; "behavioural" = requires an elasticity
# estimated in Phase 2/3 or taken from literature (cite in docs/decisions.md).
policies:
  construction_boost: {extra_units_per_year: null, cost_per_unit_eur: null}
  vacant_renovation: {units_per_year: null, cost_per_unit_eur: null}
  public_housing: {units_per_year: null, cost_per_unit_eur: null}
  imi_reform: {rate_change_pp: null}
  imt_reform: {rate_change_pp: null, first_buyer_exemption_eur: null}

# Benchmark for the p3 IMI capitalisation estimate (reports/p3_policy.md): the price effect if a permanent cut were
# fully capitalised = cut x (assessed value / price) / discount rate. Ranges are assumptions, not estimates.
imi_capitalisation_benchmark:
  tax_value_ratio: {low: 0.5, mid: 0.75, high: 1.0}   # assessed value (VPT) over market price
  discount_rate: {low: 0.03, mid: 0.04, high: 0.05}   # perpetuity rate
# p3 result (reports/p3_policy.md): the capitalisation of municipal cuts is not identified, so the simulator runs both ends.
imi_capitalisation_share: {low: 0.0, high: 1.0}
